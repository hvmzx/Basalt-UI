# Builds a release whenever a v* tag lands: one self-contained exe, published as the release's asset.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: version from the tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: publish
        shell: pwsh
        run: >
          dotnet publish src/BasaltUI/BasaltUI.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: name the exe for the release
        shell: pwsh
        run: Move-Item publish/BasaltUI.exe "BasaltUI-${{ github.ref_name }}.exe"

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: BasaltUI-${{ github.ref_name }}.exe
          generate_release_notes: true
