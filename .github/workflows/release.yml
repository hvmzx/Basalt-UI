# Builds a release whenever a v* tag lands: a portable single-file exe and a setup exe.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: version from the tag
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }

      - name: publish the single-file exe
        shell: pwsh
        run: >
          dotnet publish src/BasaltUI/BasaltUI.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: compile the installer
        shell: pwsh
        run: ./build-installer.ps1 -Version ${{ steps.ver.outputs.version }} -SkipPublish

      - name: name the portable exe for the release
        shell: pwsh
        run: Copy-Item publish/BasaltUI.exe "BasaltUI-${{ github.ref_name }}.exe"

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BasaltUI-${{ github.ref_name }}.exe
            artifacts/BasaltUI-${{ steps.ver.outputs.version }}-setup.exe
          generate_release_notes: true
